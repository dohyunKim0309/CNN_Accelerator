<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b00020"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0050b0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold">Inter-stage Ping-pong Buffering + Distributed FSM Handshake</text>

  <!-- Producer engine -->
  <rect x="40" y="120" width="180" height="180" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="130" y="150" text-anchor="middle" font-size="16" font-weight="bold">Conv2 engine</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="#555">(producer)</text>
  <rect x="80" y="195" width="100" height="50" rx="8" fill="#eef" stroke="black" stroke-width="1.5"/>
  <text x="130" y="225" text-anchor="middle" font-size="14" font-weight="bold">FSM</text>
  <text x="130" y="270" text-anchor="middle" font-size="11" fill="#555">writes one bank</text>

  <!-- Ping-pong BRAM buffer -->
  <rect x="300" y="100" width="200" height="220" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="400" y="126" text-anchor="middle" font-size="15" font-weight="bold">Ping-pong BRAM</text>
  <rect x="325" y="145" width="150" height="55" rx="8" fill="#e6f7e6" stroke="black" stroke-width="1.5"/>
  <text x="400" y="178" text-anchor="middle" font-size="14" font-weight="bold">Bank A</text>
  <rect x="325" y="215" width="150" height="55" rx="8" fill="#fdeede" stroke="black" stroke-width="1.5"/>
  <text x="400" y="248" text-anchor="middle" font-size="14" font-weight="bold">Bank B</text>
  <rect x="335" y="282" width="130" height="28" rx="6" fill="#fff" stroke="black" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="301" text-anchor="middle" font-size="12">bank_sel FF (toggle)</text>

  <!-- Consumer engine -->
  <rect x="580" y="120" width="180" height="180" rx="12" fill="white" stroke="black" stroke-width="2"/>
  <text x="670" y="150" text-anchor="middle" font-size="16" font-weight="bold">MaxPool engine</text>
  <text x="670" y="170" text-anchor="middle" font-size="12" fill="#555">(consumer)</text>
  <rect x="620" y="195" width="100" height="50" rx="8" fill="#eef" stroke="black" stroke-width="1.5"/>
  <text x="670" y="225" text-anchor="middle" font-size="14" font-weight="bold">FSM</text>
  <text x="670" y="270" text-anchor="middle" font-size="11" fill="#555">reads other bank</text>

  <!-- Producer write into buffer -->
  <line x1="220" y1="172" x2="320" y2="172" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="162" text-anchor="middle" font-size="11">write</text>

  <!-- Consumer read from buffer -->
  <line x1="480" y1="242" x2="580" y2="242" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="232" text-anchor="middle" font-size="11">read</text>

  <!-- write_done : producer -> consumer (top arc) -->
  <path d="M210,135 C360,55 440,55 590,135" fill="none" stroke="#b00020" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#b00020" font-weight="bold">write_done (1-cycle pulse)</text>

  <!-- read_done : consumer -> producer (bottom arc) -->
  <path d="M590,290 C440,380 360,380 210,290" fill="none" stroke="#0050b0" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="400" y="372" text-anchor="middle" font-size="13" fill="#0050b0" font-weight="bold">read_done (1-cycle pulse)</text>

  <!-- Bank toggle note -->
  <text x="400" y="412" text-anchor="middle" font-size="12" fill="#333">Producer writes one bank while consumer reads the other, then both toggle.</text>

  <!-- Emphasis box -->
  <rect x="160" y="435" width="480" height="40" rx="10" fill="#fffbe6" stroke="black" stroke-width="1.5"/>
  <text x="400" y="461" text-anchor="middle" font-size="14" font-weight="bold">No central controller — each engine self-controls via handshake.</text>
</svg>
