<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- title bar -->
  <rect width="1280" height="92" fill="#0F172A"/>
  <text x="56" y="57" fill="#FFFFFF" font-size="37" font-weight="700">측정 함정 — "좋아 보이는" 결과를 의심하라</text>
  <text x="1224" y="56" fill="#94A3B8" font-size="19" text-anchor="end">200 MHz baseline 재구현</text>

  <!-- left box: my (fake) result -->
  <rect x="56" y="128" width="558" height="190" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8"/>
  <text x="84" y="166" font-size="23" font-weight="700" fill="#C2410C">내 첫 결과</text>
  <text x="84" y="208" font-size="22" fill="#1E293B">WNS  <tspan font-weight="700">+0.248 ns</tspan>  (여유 ✓)</text>
  <text x="84" y="246" font-size="22" fill="#1E293B">On-chip Power  <tspan font-weight="700">1.101 W</tspan>  (절반!)</text>
  <text x="84" y="294" font-size="20" font-style="italic" fill="#C2410C">→ 어? 너무 좋은데?</text>

  <!-- right box: friend (normal) -->
  <rect x="666" y="128" width="558" height="190" rx="10" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.8"/>
  <text x="694" y="166" font-size="23" font-weight="700" fill="#15803D">친구 결과 (정상)</text>
  <text x="694" y="208" font-size="22" fill="#1E293B">On-chip Power  <tspan font-weight="700">2.545 W</tspan></text>
  <text x="694" y="246" font-size="22" fill="#1E293B">Junction Temp  <tspan font-weight="700">36.6 °C</tspan></text>
  <text x="694" y="294" font-size="20" font-style="italic" fill="#15803D">→ WNS 훨씬 빡빡 = 정상</text>

  <!-- VS -->
  <text x="640" y="232" font-size="26" font-weight="700" fill="#94A3B8" text-anchor="middle">VS</text>
  <text x="640" y="356" font-size="23" font-weight="700" fill="#475569" text-anchor="middle">같은 RTL · 같은 결선인데 왜 이렇게 다를까?</text>

  <!-- cause box (red) -->
  <rect x="56" y="384" width="1168" height="130" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <rect x="56" y="384" width="6" height="130" fill="#DC2626"/>
  <text x="86" y="422" font-size="22" font-weight="700" fill="#B91C1C">원인 — 둘 다 가짜였다</text>
  <text x="86" y="458" font-size="20" fill="#334155">datapath clk (clk_wiz / <tspan font-weight="700">clk_out3</tspan>, 200 MHz) 가 Block Design 에서 <tspan font-weight="700">미연결</tspan></text>
  <text x="86" y="490" font-size="20" fill="#334155">→ 200 MHz 도메인 로직이 합성에서 잘려나감(trim) → WNS · Power 모두 의미 없는 값</text>

  <!-- lesson box (blue) -->
  <rect x="56" y="532" width="1168" height="156" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="56" y="532" width="6" height="156" fill="#2563EB"/>
  <text x="86" y="570" font-size="22" font-weight="700" fill="#1D4ED8">교훈</text>
  <text x="86" y="606" font-size="20" fill="#334155">positive WNS + 낮은 power 가 항상 좋은 게 아니다 — <tspan font-weight="700">로직이 빠졌을 때도</tspan> 그렇게 보인다</text>
  <text x="86" y="644" font-size="20" fill="#334155">검증 :  DSP util (baseline ~226/240 = 94%)  ·  report_clocks (clk_out3 = 5 ns)  ·  power by-clock</text>
  <text x="86" y="676" font-size="17" font-style="italic" fill="#64748B">측정으로 진짜 병목을 찾는다 — 이 프로젝트의 방법론</text>
</svg>
