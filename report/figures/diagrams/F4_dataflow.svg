<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold">Single-image Dataflow Path</text>

  <!-- ROW 1: PS -> Input BRAM -> Conv1 -> [c1c2] -> Conv2 -->
  <!-- PS -->
  <rect x="20" y="80" width="90" height="60" rx="10" fill="#eef" stroke="black" stroke-width="2"/>
  <text x="65" y="108" text-anchor="middle" font-size="13" font-weight="bold">PS</text>
  <text x="65" y="126" text-anchor="middle" font-size="10">MicroBlaze</text>

  <!-- Input BRAM -->
  <rect x="150" y="80" width="100" height="60" rx="10" fill="#e6f7e6" stroke="black" stroke-width="2"/>
  <text x="200" y="106" text-anchor="middle" font-size="12" font-weight="bold">Input BRAM</text>
  <text x="200" y="124" text-anchor="middle" font-size="10" fill="#555">(1,28,28)</text>

  <!-- Conv1 -->
  <rect x="290" y="80" width="90" height="60" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="335" y="115" text-anchor="middle" font-size="14" font-weight="bold">Conv1</text>

  <!-- c1c2 ping-pong -->
  <g>
    <rect x="420" y="86" width="50" height="48" rx="6" fill="#fff" stroke="black" stroke-width="1.5"/>
    <rect x="428" y="94" width="50" height="48" rx="6" fill="#fdeede" stroke="black" stroke-width="1.5"/>
    <text x="448" y="160" text-anchor="middle" font-size="10">C1C2 buf</text>
  </g>

  <!-- Conv2 -->
  <rect x="510" y="80" width="90" height="60" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="555" y="115" text-anchor="middle" font-size="14" font-weight="bold">Conv2</text>

  <!-- shape labels row1 -->
  <text x="335" y="160" text-anchor="middle" font-size="10" fill="#555">(8,26,26)</text>
  <text x="555" y="160" text-anchor="middle" font-size="10" fill="#555">(16,24,24)</text>

  <!-- arrows row1 -->
  <line x1="110" y1="110" x2="148" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="110" x2="288" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="110" x2="418" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="110" x2="508" y2="110" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- vertical link Conv2 down to row2 -->
  <line x1="555" y1="140" x2="555" y2="240" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ROW 2 (right to left): Conv2 -> [c2pool] -> MaxPool -> [poolfc] -> FC -->
  <!-- c2pool ping-pong (under Conv2) -->
  <g>
    <rect x="500" y="246" width="50" height="48" rx="6" fill="#fff" stroke="black" stroke-width="1.5"/>
    <rect x="508" y="254" width="50" height="48" rx="6" fill="#fdeede" stroke="black" stroke-width="1.5"/>
    <text x="528" y="320" text-anchor="middle" font-size="10">C2Pool buf</text>
  </g>

  <!-- MaxPool -->
  <rect x="370" y="250" width="90" height="60" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="415" y="285" text-anchor="middle" font-size="13" font-weight="bold">MaxPool</text>
  <text x="415" y="330" text-anchor="middle" font-size="10" fill="#555">(16,12,12)</text>

  <!-- poolfc ping-pong -->
  <g>
    <rect x="282" y="256" width="50" height="48" rx="6" fill="#fff" stroke="black" stroke-width="1.5"/>
    <rect x="290" y="264" width="50" height="48" rx="6" fill="#fdeede" stroke="black" stroke-width="1.5"/>
    <text x="310" y="330" text-anchor="middle" font-size="10">PoolFC buf</text>
  </g>

  <!-- FC -->
  <rect x="150" y="250" width="90" height="60" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="195" y="285" text-anchor="middle" font-size="14" font-weight="bold">FC</text>
  <text x="195" y="330" text-anchor="middle" font-size="10" fill="#555">10 logits</text>

  <!-- arrows row2 (right to left) -->
  <line x1="500" y1="280" x2="462" y2="280" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="280" x2="334" y2="280" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="282" y1="280" x2="242" y2="280" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- vertical link FC down to row3 -->
  <line x1="195" y1="310" x2="195" y2="380" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ROW 3: FC -> argmax -> Output BRAM -> PS -->
  <!-- argmax -->
  <rect x="150" y="390" width="100" height="55" rx="10" fill="#fffbe6" stroke="black" stroke-width="2"/>
  <text x="200" y="414" text-anchor="middle" font-size="13" font-weight="bold">argmax</text>
  <text x="200" y="432" text-anchor="middle" font-size="10" fill="#555">class (0-9)</text>

  <!-- Output BRAM -->
  <rect x="300" y="390" width="110" height="55" rx="10" fill="#e6f7e6" stroke="black" stroke-width="2"/>
  <text x="355" y="421" text-anchor="middle" font-size="12" font-weight="bold">Output BRAM</text>

  <!-- PS (read result) -->
  <rect x="460" y="390" width="90" height="55" rx="10" fill="#eef" stroke="black" stroke-width="2"/>
  <text x="505" y="414" text-anchor="middle" font-size="13" font-weight="bold">PS</text>
  <text x="505" y="432" text-anchor="middle" font-size="10">reads result</text>

  <!-- arrows row3 -->
  <line x1="250" y1="417" x2="298" y2="417" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="417" x2="458" y2="417" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="600" y="390" width="180" height="60" rx="8" fill="white" stroke="black" stroke-width="1"/>
  <rect x="612" y="402" width="22" height="20" rx="4" fill="#fdeede" stroke="black" stroke-width="1"/>
  <text x="642" y="417" font-size="11">ping-pong buffer</text>
  <rect x="612" y="426" width="22" height="14" rx="3" fill="#e6f7e6" stroke="black" stroke-width="1"/>
  <text x="642" y="437" font-size="11">BRAM</text>
</svg>
